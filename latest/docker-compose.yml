version: '3'
services:
  itsmweb :
    image : docker.io/itsmng/itsm-ng:latest
    depends_on:
      - itsmdb
    container_name : itsmweb
    restart: always
    volumes :
      - itsmng-config:/etc/itsm-ng/config
      - itsmng-plugins:/usr/share/itsm-ng/plugins
      - itsmng-files:/var/lib/itsm-ng
    environment:
      MARIADB_HOST : itsmdb
      MARIADB_USER : itsmng
      MARIADB_PASSWORD : itsmng
      MARIADB_DATABASE : itsmng
      # ITSMNG_PLUGINS: |
      #   accounts
      #   barcode
      #   consumables
      #   databases
      #   dashboardng
      #   datainjection
      #   edittraduction
      #   escalade
      #   fields
      #   formcreator
      #   genericobject
      #   mreporting
      #   news
      #   oauthimap
      #   ocsinventoryng
      #   okta
      #   onetimesecret
      #   pdf
      #   tag
      #   timelineticket
      #   useditemsexport
      #   whitelabel
      #   workflows
  itsmdb :
    image: docker.io/mariadb:10.6
    container_name: itsmdb
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    volumes :
      - itsmng-data:/var/lib/mysql
    environment:
      MARIADB_AUTO_UPGRADE: "yes"
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MYSQL_ROOT_PASSWORD: iamastrongpassword
      MARIADB_USER : itsmng
      MARIADB_PASSWORD : itsmng
      MARIADB_DATABASE : itsmng

volumes:
  itsmng-config:
  itsmng-plugins:
  itsmng-files:
  itsmng-data:

