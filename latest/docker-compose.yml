version: '3'
services:
  itsmweb :
    image : docker.io/itsmng/itsm-ng:latest
    depends_on:
      - itsmdb
    container_name : itsmweb
    restart: always
    ports :
      - "8080:8080"
    # Runs entirely as the unprivileged www-data user (uid/gid 33), no root
    # capability, no privilege escalation and a read-only root filesystem;
    # mirrors the securityContext expected in a PSS "restricted" Kubernetes cluster.
    user: "33:33"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /run/apache2
      - /var/lock/apache2
      - /var/log/apache2
      - /run/php
    volumes :
      - itsmng-config:/etc/itsm-ng/config
      - itsmng-plugins:/usr/share/itsm-ng/plugins
      - itsmng-files:/var/lib/itsm-ng
    environment:
      MARIADB_HOST : itsmdb
      MARIADB_USER : itsmng
      MARIADB_PASSWORD : itsmng
      MARIADB_DATABASE : itsmng
      # Plugins can no longer be installed at runtime (it required root and a
      # writable root filesystem). Build the image with
      # --build-arg ITSMNG_PLUGINS="accounts barcode ..." instead.
      #   accounts
      #   barcode
      #   consumables
      #   databases
      #   dashboardng
      #   datainjection
      #   edittraduction
      #   escalade
      #   fields
      #   formcreator
      #   genericobject
      #   mreporting
      #   news
      #   oauthimap
      #   ocsinventoryng
      #   okta
      #   onetimesecret
      #   pdf
      #   tag
      #   timelineticket
      #   useditemsexport
      #   whitelabel
      #   workflows
  itsmdb :
    image: docker.io/mariadb:10.6
    container_name: itsmdb
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    volumes :
      - itsmng-data:/var/lib/mysql
    environment:
      MARIADB_AUTO_UPGRADE: "yes"
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MYSQL_ROOT_PASSWORD: iamastrongpassword
      MARIADB_USER : itsmng
      MARIADB_PASSWORD : itsmng
      MARIADB_DATABASE : itsmng

volumes:
  itsmng-config:
  itsmng-plugins:
  itsmng-files:
  itsmng-data:

