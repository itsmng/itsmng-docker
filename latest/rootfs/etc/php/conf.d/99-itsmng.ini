; Reglages PHP pour ITSM-NG en conteneur (Apache + CLI).
; Pour surcharger : monter un fichier .ini dans
; /etc/php/8.4/apache2/conf.d/ (ex: zz-local.ini).

expose_php = Off
memory_limit = 512M
max_execution_time = 600
max_input_vars = 5000

upload_max_filesize = 64M
post_max_size = 68M
max_file_uploads = 50
; Uploads temporaires en tmpfs : compatible rootfs en lecture seule.
upload_tmp_dir = /tmp
sys_temp_dir = /tmp

; Les sessions vivent dans le volume de donnees, pas dans /var/lib/php
; (appartient a root et non inscriptible en non-root).
session.save_path = "/var/lib/itsm-ng/_sessions"
session.use_strict_mode = On
session.cookie_httponly = On
session.cookie_samesite = "Lax"

date.timezone = "UTC"

; Le code applicatif est immuable dans l'image : on peut donc desactiver la
; revalidation des timestamps, ce qui supprime des milliers de stat() par
; requete. Corollaire : toute mise a jour de code passe par un nouveau build.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

apc.enable_cli = 1
