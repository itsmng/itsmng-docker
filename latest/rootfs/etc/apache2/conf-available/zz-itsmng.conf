# Reglages globaux du conteneur. Charge apres apache2.conf (prefixe zz).

# Evite l'avertissement au demarrage et ne depend pas d'un DNS interne.
ServerName itsm-ng

# Durcissement de base.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None

# Tous les logs vont vers la sortie du conteneur : rien n'est ecrit sur disque,
# le rootfs peut donc rester en lecture seule.
ErrorLog /dev/stderr
LogLevel warn

Timeout 60
KeepAlive On
KeepAliveTimeout 5
