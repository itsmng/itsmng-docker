<VirtualHost *:8080>
	# On sert directement le repertoire du paquet Debian. /var/www/itsm-ng
	# reste un lien symbolique, conserve pour compatibilite/CLI, mais Apache
	# resout les liens : les blocs <Directory> doivent viser le chemin reel.
	DocumentRoot /usr/share/itsm-ng

	CustomLog /dev/stdout combined
	ErrorLog /dev/stderr

	<Directory /usr/share/itsm-ng>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# Defense en profondeur : ces repertoires restent interdits meme si les
	# .htaccess livres par l'application disparaissent.
	<DirectoryMatch "^/usr/share/itsm-ng/(files|config|tests|tools|vendor)(/|$)">
		Require all denied
	</DirectoryMatch>

	<FilesMatch "\.(sql|log|ini|sh|bak|swp|dist|lock|json|md|ya?ml)$">
		Require all denied
	</FilesMatch>

	<LocationMatch "/\.(git|svn|env)">
		Require all denied
	</LocationMatch>

	# Sonde de sante statique : ne touche ni PHP ni la base de donnees, donc
	# une base indisponible ne fait pas redemarrer le pod en boucle.
	Alias /healthz /usr/local/share/itsm-ng/healthz
	<Directory /usr/local/share/itsm-ng>
		Require all granted
		Options -Indexes
	</Directory>

	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
		Header always set X-Frame-Options "SAMEORIGIN"
		Header always set Referrer-Policy "strict-origin-when-cross-origin"
	</IfModule>
</VirtualHost>
