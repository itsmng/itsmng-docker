# Taches planifiees ITSM-NG.
#
# Remplace le demon cron dans le conteneur applicatif et l'image "-cron"
# separee : c'est la meme image, avec une commande differente.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: itsm-ng-cron
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 0
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cron
              image: ghcr.io/itsmng/itsm-ng:latest
              command: ["itsmng-cron"]
              envFrom:
                - configMapRef:
                    name: itsm-ng-db
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: data
                  mountPath: /var/lib/itsm-ng
                - name: db-password
                  mountPath: /run/secrets/itsm-ng
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: itsm-ng-data
            - name: db-password
              secret:
                secretName: itsm-ng-db
                defaultMode: 0400
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
